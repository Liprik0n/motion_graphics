<!-- Сцена-проба наборов стилей (films/kits.json; engine/video/styles/README.md «Миры с набором сцены»).
     Один элемент stage — «мир сцены» (строка b1 вплотную под ним — его опора, V15): его рисует набор того стиля, в котором идёт проход (ComicKit, PixelKit,
     PaperKit, FlatEdu, NeonKit, TvSplash); скрипт в конце файла подключает сцену к каждому набору. Времена — якорями
     {reply, at, offset} через kit.at и метками действий через kit.cues, секунд здесь нет. Предметы студии (data-obj) рисует стиль flat-edu.
     Манекен — образец героя проекта: части тела — данные сцены, цвета — роли палитры (var(--c-…)), конечности
     размечены data-limb="<герой>:<сторона>:<up|down>" — по ним условие V25 «поза» видит третью руку.
     Hex в разметке нельзя (V12): цвета мира берутся у набора (kit.decor), цвета героя — у палитры проекта. -->
<div class="el" id="stage" style="left:120px; top:330px; width:1680px; height:520px;">
  <div data-obj="foam" style="position:absolute; left:0px; top:0px; width:1680px; height:520px;"></div>
  <div data-obj="floor" style="position:absolute; left:0px; top:496px; width:1680px; height:24px;"></div>
  <div data-obj="booth-window" style="position:absolute; left:760px; top:24px; width:320px; height:190px;"></div>
  <div data-obj="lamp-box" style="position:absolute; left:470px; top:40px; width:230px; height:68px;"></div>
  <div data-obj="monitor" data-sx="20" data-sy="20" data-sw="330" data-sh="190" style="position:absolute; left:60px; top:16px; width:370px; height:280px;"></div>
  <div data-obj="desk" data-console="90" style="position:absolute; left:40px; top:270px; width:700px; height:226px;"></div>
  <div data-obj="mug" style="position:absolute; left:610px; top:216px; width:52px; height:56px;"></div>
  <div data-obj="mic" style="position:absolute; left:800px; top:196px; width:150px; height:300px;"></div>
  <div data-obj="hook-keys" style="position:absolute; left:1130px; top:60px; width:60px; height:110px;"></div>
  <div data-obj="door" style="position:absolute; left:1210px; top:66px; width:210px; height:430px;"></div>
  <svg width="200" height="420" viewBox="0 0 200 420" style="position:absolute; left:1450px; top:76px; overflow:visible;">
    <g style="fill:var(--c-primary); stroke:var(--c-ink); stroke-width:7; stroke-linejoin:round; stroke-linecap:round;">
      <path data-limb="maneken:left:down" d="M62 164 L34 284" style="fill:none;"/>
      <path d="M72 300 V410 M128 300 V410" style="fill:none;"/>
      <path d="M60 150 H140 L152 300 H48 Z"/>
      <circle data-body="head" cx="100" cy="96" r="44" style="fill:var(--c-paper);"/>
      <path data-limb="maneken:right:down" d="M138 164 L166 284" style="fill:none;"/>
      <path data-limb="maneken:right:up" d="M138 164 L178 52" style="fill:none;"/>
    </g>
  </svg>
</div>
<script>
(function () {
  'use strict';
  var SC = 'kit-probe', W = 1680, H = 520;
  function host() { return document.getElementById(SC + '--stage'); }
  function world() {                     // слой мира набора: под предметами и манекеном сцены
    var d = document.createElement('div');
    d.style.cssText = 'position:absolute;left:0;top:0;width:' + W + 'px;height:' + H + 'px;overflow:hidden;';
    host().insertBefore(d, host().firstChild);
    return d;
  }

  /* Манекен играет метки действий сцены (раскадровка plugins.act.cues, плагин act): «go» — поднимает голову,
     «wave» — поднимает правую руку. Рук всегда две: поднятая показана — опущенная той же стороны скрыта (V25).
     Исполнитель не зависит от стиля: идёт и в проходе без стиля; состояние — чистая функция t по всем меткам.
     Наборы стилей ниже берут время у тех же меток (kit.cues) — мир и герой двигаются на одну метку. */
  (window.ActExec = window.ActExec || []).push({ scene: SC, who: 'stage', run: function (t, cues, api) {
    var st = host(), by = {};
    cues.forEach(function (c) { by[c.cue.id] = c; });
    var raised = by.wave.local >= 0;
    api.setAttr(st.querySelector('[data-limb$=":right:up"]'), 'visibility', raised ? 'inherit' : 'hidden');
    api.setAttr(st.querySelector('[data-limb$=":right:down"]'), 'visibility', raised ? 'hidden' : 'inherit');
    api.setAttr(st.querySelector('[data-body="head"]'), 'transform', 'translate(0,' + (-by.go.cue.m.rise_px * by.go.e).toFixed(2) + ')');
  } });
  function cueT(kit, id) { return kit.cues(SC).filter(function (c) { return c.id === id; })[0].t; }

  (window.ComicScenes = window.ComicScenes || []).push({ scene: SC, setup: function (kit, FILM, api) {
    var D = kit.decor, S = kit.S, svg = kit.svgIn(world(), W, H);
    S(svg, 'rect', { x: 0, y: 0, width: W, height: H, fill: D.sky });
    S(svg, 'rect', { x: 0, y: 0, width: W, height: H, fill: kit.dots(D.pink, 14, 4, 0.8) });
    kit.ink(svg, 'M-10 ' + (H - 70) + ' H' + (W + 10) + ' V' + (H + 10) + ' H-10 Z', D.night);
    var heli = kit.heli(svg), taxi = kit.taxi(svg), boom = S(svg, 'g', {});
    kit.ink(boom, kit.star(0, 0, 11, 120, 74, 0.2), D.red);
    S(boom, 'path', { d: kit.star(0, 0, 11, 84, 52, 0.35), fill: D.sun });
    kit.taper(boom, 'M-50 0 Q0 -26 50 0', 4, 12);
    var tBoom = kit.at({ reply: 1, at: 0.6 });
    var drive = kit.track(-320, [{ t: cueT(kit, 'go'), v: 430, d: 1.6, e: 'power2.out' }]);
    return { frame: function (t) {
      var ts = kit.step(t), x = drive(t);
      kit.tr(taxi.g, x, H - 44, 0, 0.8);
      taxi.wheels.forEach(function (w) { api.setAttr(w, 'transform', 'rotate(' + (-x * 1.4).toFixed(1) + ')'); });
      kit.tr(heli.g, 1010, 70 + Math.sin(ts * 1.3) * 10, 0, 0.7); heli.rotor(ts * 9, 1);
      var p = api.clamp01((t - tBoom) / 0.35);
      kit.tr(boom, 800, 250, 0, p <= 0 ? 0.001 : kit.back(p, 2.2)); kit.show(boom, p > 0);
    } };
  } });

  (window.PixelScenes = window.PixelScenes || []).push({ scene: SC, setup: function (kit, FILM, api) {
    var D = kit.decor, U = kit.U, svg = kit.svg('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H }, world());
    var ground = kit.snap(H - 6 * U);
    kit.rect(svg, 0, 0, W, H, D.sky_dusk);
    kit.rect(svg, 0, ground, W, H - ground, D.snow);
    kit.house(svg, kit.snap(100), ground, 44 * U, 40 * U, { sign: { w: 26 * U, h: 6 * U }, seed: 1 });
    var gl = kit.garland(svg, kit.snap(480), kit.snap(1180), kit.snap(70), 6 * U);
    var taxi = kit.taxi(svg), horse = [kit.px(svg, 0, 0, kit.art.horse[0]), kit.px(svg, 0, 0, kit.art.horse[1])];
    kit.px(svg, kit.snap(1210), ground - 14 * U, kit.art.snowman);
    kit.px(svg, kit.snap(1320), ground - 17 * U, kit.art.fir);
    api.setAttr(taxi.g, 'transform', 'translate(' + kit.snap(560) + ',' + (ground - taxi.h) + ')');
    var run = kit.track(480, [{ t: cueT(kit, 'go'), v: 1040, d: 2.4, e: 'none' }]);
    return { frame: function (t) {
      var ts = kit.step(t), gait = Math.floor(ts * 6) % 2, lamps = Math.floor(ts * 2) % 2;
      horse.forEach(function (g, n) {
        api.setAttr(g, 'transform', 'translate(' + kit.snap(run(ts)) + ',' + (ground - 14 * U) + ')');
        api.setAttr(g, 'visibility', n === gait ? 'inherit' : 'hidden');
      });
      api.setAttr(gl[0], 'opacity', lamps ? '1' : '0.45'); api.setAttr(gl[1], 'opacity', lamps ? '0.45' : '1');
    } };
  } });

  (window.PaperScenes = window.PaperScenes || []).push({ scene: SC, setup: function (kit, FILM, api) {
    var D = kit.decor, S = kit.S, svg = kit.svgIn(world(), W, H);
    S(svg, 'rect', { x: 0, y: 0, width: W, height: H, fill: D.sky });
    var c1 = kit.sheet(svg, kit.cloud(150, 190, 300, 11), D.cloud), c2 = kit.sheet(svg, kit.cloud(1040, 140, 240, 23), D.cloud);
    var bank = kit.sheet(svg, kit.bank(-20, W + 20, 120, 5), D.cloud, { sh: 0.6 });
    api.setAttr(bank, 'transform', 'translate(0,' + (H - 150) + ')');
    var heli = kit.heli(svg), fly = kit.track(-420, [{ t: cueT(kit, 'go'), v: 700, d: 2.0, e: 'power2.out' }]);
    return { frame: function (t) {
      var ts = kit.step(t);
      api.setAttr(heli.g, 'transform', 'translate(' + kit.f1(fly(ts)) + ',' + kit.f1(110 + Math.sin(ts * 1.4) * 8) + ') scale(0.8)');
      heli.rotor(ts * 9);
      api.setAttr(c1, 'transform', 'translate(' + kit.f1(Math.sin(ts * 0.3) * 30) + ',0)');
      api.setAttr(c2, 'transform', 'translate(' + kit.f1(Math.sin(ts * 0.3 + 2) * 30) + ',0)');
    } };
  } });

  (window.FlatEduScenes = window.FlatEduScenes || []).push({ scene: SC, setup: function (kit, FILM, api) {
    var st = host(), toggle = st.querySelector('.toggle'), leaf = st.querySelector('.leaf');
    var flip = kit.track(0, [{ t: kit.at({ reply: 1, at: 0.5 }), v: 34, d: 0.25, e: 'power2.out' }]);
    var open = kit.track(1, [{ t: cueT(kit, 'wave'), v: 0.3, d: 0.6 }]);
    return { frame: function (t) {
      api.setAttr(toggle, 'transform', 'rotate(' + flip(t).toFixed(2) + ' ' + toggle.getAttribute('data-pivot') + ')');
      var px = leaf.getAttribute('data-pivot').split(' ')[0];
      api.setAttr(leaf, 'transform', 'translate(' + px + ' 0) scale(' + open(t).toFixed(3) + ' 1) translate(-' + px + ' 0)');
    } };
  } });

  (window.NeonScenes = window.NeonScenes || []).push({ scene: SC, setup: function (kit, FILM, api) {
    var D = kit.decor, svg = kit.svg('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H }, world());
    var floor = 'M40 500 H' + (W - 40);
    var arch = kit.neon(svg, 'path', { d: 'M120 500 V180 Q120 60 240 60 H520 Q640 60 640 180 V500' }, D.violet_soft, 3, { lx: 120, len: 1500 });
    var rail = kit.neon(svg, 'path', { d: floor }, D.dim, 1.6, { hot: false, fine: true, lx: 40, len: W - 80 });
    var glow = kit.pool(svg, svg, 1020, 470, 380, 90, D.gold_warm, 0.25);
    var sign = kit.neon(svg, 'rect', { x: 760, y: 90, width: 520, height: 170, rx: 20 }, D.gold_warm, 3);
    var run = kit.flow(svg, floor, D.violet_soft, 1.4);
    var t0 = cueT(kit, 'go'), tOn = kit.at({ reply: 1, at: 0.55 });
    var draw = kit.drawIn([arch, rail], t0, 1400, 0.3), st = kit.strike('probe-sign'), br = kit.breath('probe-sign');
    return { frame: function (t) {
      draw(t);
      var q = st.at(t - tOn), b = br(t);
      sign.light(q.c, q.h * b); glow.set(Math.min(1, q.c) * b);
      run.set(Math.max(0, t - t0) * kit.params.light.flow.speed, api.clamp01((t - t0) / 0.5));
    }, probe: function (t) { return { sign: Math.round(st.at(t - tOn).c * 1000) / 1000 }; } };
  } });

  (window.TvSplashScenes = window.TvSplashScenes || []).push({ scene: SC, setup: function (kit, FILM, api) {
    var light = kit.track(0, [{ t: kit.scene(SC).start + 0.2, v: 1, d: 1.2, e: 'power2.out' }]);
    return { light: light, hits: [cueT(kit, 'wave')] };
  } });
})();
</script>
